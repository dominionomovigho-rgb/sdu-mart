<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Add a Product — SDU Mart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="logo">SDU<span>Mart</span></a>
      <nav class="header-nav">
        <a href="login.html" class="btn-outline">Log in</a>
        <a href="register.html" class="btn-solid">Sign up</a>
      </nav>
    </div>
  </header>

  <main class="auth-page">
    <div class="auth-card auth-card-wide">
      <h1>Add a new product</h1>
      <p class="auth-subtitle">List an item for sale in your shop.</p>

      <p id="statusMessage" class="vendor-note" hidden></p>

      <form class="auth-form" id="addProductForm">
        <label>
          Product name
          <input type="text" name="name" placeholder="e.g. Vanilla Musk Perfume" required>
        </label>

        <label>
          Description
          <textarea name="description" rows="3" placeholder="Briefly describe the product"></textarea>
        </label>

        <div class="form-row">
          <label>
            Price (₦)
            <input type="number" name="price" min="0" step="0.01" placeholder="e.g. 4500" required>
          </label>
          <label>
            Stock quantity
            <input type="number" name="stock_quantity" min="0" placeholder="e.g. 20" required>
          </label>
        </div>

        <label>
          Category
          <select name="category_id" id="categorySelect">
            <option value="">Loading categories...</option>
          </select>
        </label>

        <button type="submit" class="btn-solid btn-large auth-submit">Add product</button>
      </form>
    </div>
  </main>

<script src="js/script.js"></script>
<script src="js/add-product.js"></script>
</body>
</html>
